version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tcp-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tcp_clean_db
      MYSQL_USER: tcp_user
      MYSQL_PASSWORD: tcp_password
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - tcp-network

  redis:
    image: redis:7-alpine
    container_name: tcp-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redispass
    volumes:
      - redis-data:/data
    networks:
      - tcp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tcp-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tcp_clean_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=tcp_user
      - SPRING_DATASOURCE_PASSWORD=tcp_password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redispass
    depends_on:
      - mysql
      - redis
    networks:
      - tcp-network

  # [React ?꾨줎?몄뿏??而⑦뀒?대꼫]
  # ??먮텇??frontend ?대뜑??React 肄붾뱶瑜?梨꾩썙?ｌ쑝?쒕㈃ ?꾨옒 二쇱꽍???怨??ㅽ뻾?섏꽭??
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tcp-frontend
    ports:
      - "3000:80" # Nginx媛 ?대??곸쑝濡?80踰??ы듃瑜??곷땲??
    depends_on:
      - backend
    networks:
      - tcp-network

networks:
  tcp-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:

