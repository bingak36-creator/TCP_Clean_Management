spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tcp_clean_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:tcp_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: false
    baseline-version: 1
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:}

iot:
  upstash:
    enabled: ${UPSTASH_SYNC_ENABLED:true}
    redis-url: ${UPSTASH_REDIS_URL:${UPSTASH_REDIS_REST_URL:}}
    rest-token: ${UPSTASH_REDIS_REST_TOKEN:}
    poll-interval-ms: ${UPSTASH_POLL_INTERVAL_MS:120000}
    batch-size: ${UPSTASH_BATCH_SIZE:200}
    discovery-interval-ms: ${UPSTASH_DISCOVERY_INTERVAL_MS:300000}

app:
  auth:
    session-ttl-seconds: ${AUTH_SESSION_TTL_SECONDS:28800}
    bootstrap-username: ${TCP_BOOTSTRAP_USERNAME:}
    bootstrap-password: ${TCP_BOOTSTRAP_PASSWORD:}
  rate-limit:
    store: ${RATE_LIMIT_STORE:redis}
  seed-demo-data: ${SEED_DEMO_DATA:false}

restroom-ai:
  enabled: ${RESTROOM_AI_ENABLED:true}
  directory: ${RESTROOM_AI_DIRECTORY:ai}
  python: ${RESTROOM_AI_PYTHON:}
  timeout-seconds: ${RESTROOM_AI_TIMEOUT_SECONDS:30}
  poll-interval-ms: ${RESTROOM_AI_POLL_INTERVAL_MS:1000}
  batch-size: ${RESTROOM_AI_BATCH_SIZE:50}
  input-wait-seconds: ${RESTROOM_AI_INPUT_WAIT_SECONDS:300}
  backfill-hours: ${RESTROOM_AI_BACKFILL_HOURS:4}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: native
